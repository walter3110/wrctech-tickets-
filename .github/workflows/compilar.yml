name: Compilar apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: soporte
            nombre: "WRCtech Soporte"
          - app: tecnico
            nombre: "WRCtech Tickets"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar proyecto Android
        working-directory: apps/${{ matrix.app }}
        run: flutter create --org com.wrctech --project-name ${{ matrix.app }} --platforms android .

      - name: Nombre de la app y permisos
        run: python3 tool/ajustar_android.py apps/${{ matrix.app }} "${{ matrix.nombre }}"

      - name: Dependencias e ícono
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Compilar APK
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter build apk --release
          mkdir -p ../../salida
          cp build/app/outputs/flutter-apk/app-release.apk ../../salida/wrctech-${{ matrix.app }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app }}
          path: salida/*.apk

  publicar:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: salida

      - name: Publicar para descargar desde el celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Versión ${{ github.run_number }}
          files: salida/*.apk
